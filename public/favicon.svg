<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b6b6b"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#888888"/>
      <stop offset="100%" stop-color="#444444"/>
    </linearGradient>
  </defs>

  <!-- Front face of vertical bar -->
  <rect x="80" y="60" width="110" height="340" fill="url(#front)"/>
  <!-- Front face of horizontal bar -->
  <rect x="80" y="340" width="290" height="110" fill="url(#front)"/>

  <!-- Right side of vertical bar (3D depth) -->
  <polygon points="190,60 230,30 230,370 190,400" fill="url(#side)"/>
  <!-- Right side of horizontal bar -->
  <polygon points="370,340 410,310 410,420 370,450" fill="url(#side)"/>

  <!-- Top of vertical bar -->
  <polygon points="80,60 120,30 230,30 190,60" fill="url(#top)"/>
  <!-- Top of horizontal bar -->
  <polygon points="190,340 230,310 410,310 370,340" fill="url(#top)"/>

  <!-- Bottom connector -->
  <polygon points="80,450 120,420 410,420 370,450" fill="#1a1a1a"/>
</svg>
